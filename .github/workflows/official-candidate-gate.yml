name: Official Candidate Gate

# IMPORTANT:
# This workflow is the independent judge for Forge candidate branches.
# It runs from the default branch on a schedule or explicit dispatch.
# Candidate branches are data/input; their workflow files are never executed.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Optional exact candidate branch to validate (project/* or review/*)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: official-candidate-gate-${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'scheduled' }}
  cancel-in-progress: false

env:
  AC_REPO: https://github.com/mod-playerbots/azerothcore-wotlk.git
  AC_COMMIT: 47960183bb03b83e8943eb2f0f39c16df9710c9d
  PLAYERBOTS_REPO: https://github.com/mod-playerbots/mod-playerbots.git
  PLAYERBOTS_COMMIT: 2f7d9f774987d0157c6a0d0cc08c40bec3db3945

jobs:
  discover:
    name: Discover new candidate branches
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Require default-branch judge
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo 'Official acceptance must use the default-branch workflow.' >&2
            exit 1
          }

      - name: Discover branches
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/candidates.json
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ['GITHUB_REPOSITORY']
          requested = os.environ.get('REQUESTED_BRANCH', '').strip()

          def gh(path):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{repo}/{path}'], text=True
              ))

          names = []
          if requested:
              if not (requested.startswith('project/') or requested.startswith('review/')):
                  raise SystemExit('Manual branch must begin with project/ or review/.')
              names = [requested]
          else:
              page = 1
              while True:
                  rows = gh(f'branches?per_page=100&page={page}')
                  if not rows:
                      break
                  names.extend(
                      r['name'] for r in rows
                      if r['name'].startswith('project/') or r['name'].startswith('review/')
                  )
                  if len(rows) < 100:
                      break
                  page += 1

          out = []
          now = datetime.now(timezone.utc)
          freshness = timedelta(minutes=35)
          for name in sorted(set(names)):
              branch = gh('branches/' + name.replace('/', '%2F'))
              sha = branch['commit']['sha']
              commit = gh(f'commits/{sha}')
              stamp = commit['commit']['committer']['date']
              dt = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              # Scheduled runs only validate recently changed candidates.
              # Manual dispatch always validates the requested branch.
              if requested or now - dt <= freshness:
                  out.append({'branch': name, 'sha': sha})

          print(json.dumps({'include': out}, separators=(',', ':')))
          PY

          matrix="$(cat /tmp/candidates.json)"
          count="$(python3 -c 'import json; print(len(json.load(open("/tmp/candidates.json"))["include"]))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count candidate(s): $matrix"

  validate:
    name: Validate ${{ matrix.branch }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CANDIDATE_BRANCH: ${{ matrix.branch }}
      CANDIDATE_SHA: ${{ matrix.sha }}
      # Every step, including the protected build wrapper, uses the same cache.
      CCACHE_DIR: ${{ github.workspace }}/.forge-ccache
      CCACHE_TEMPDIR: ${{ runner.temp }}/forge-ccache-tmp
      CCACHE_CONFIGPATH: ${{ runner.temp }}/forge-ccache.conf
    steps:
      - name: Checkout exact judge version for evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: judge
          fetch-depth: 1
          persist-credentials: false

      - name: Record immutable judge identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > evidence/judge-sha.txt
          sha256sum judge/.github/workflows/official-candidate-gate.yml > evidence/judge-workflow.sha256
          sha256sum \
            judge/.github/workflows/official-candidate-gate.yml \
            judge/UPSTREAM_WARNING_POLICY.md \
            judge/WORLDMOCK_FIXTURE_EXCEPTION.md \
            judge/validation/upstream-warning-policy.json \
            judge/validation/worldmock-fixture.json \
            judge/validation/worldmock-fixture.patch \
            judge/validation/upstream-warning-hook.cmake \
            judge/validation/verify_build.py \
            judge/validation/test_verify_build.py > evidence/protected-validation.sha256
          printf '%s\n' "$CANDIDATE_SHA" > evidence/candidate-sha.txt
          printf '%s\n' "$AC_COMMIT" "$PLAYERBOTS_COMMIT" > evidence/dependency-pins.txt

      - name: Checkout candidate as inert input
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Candidate integrity and scope gate
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          git -C candidate remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate fetch --no-tags origin "$GITHUB_WORKFLOW_SHA"
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]

          changed="$(git -C candidate diff --name-only "$GITHUB_WORKFLOW_SHA"...HEAD)"
          printf '%s\n' "$changed" | tee /tmp/changed-files.txt

          if [[ -z "$changed" ]]; then
            echo 'Candidate has no changes relative to main.' >&2
            exit 1
          fi

          # Candidate branches are not allowed to modify the judge or shared authority.
          if printf '%s\n' "$changed" | grep -Eq '^(.github/|AGENTS\.md$|VALIDATION_INTEGRITY\.md$|TEAM_PROTOCOL\.md$|FORGE_MISSION\.md$|DEADLINE\.md$|RUN_STATE\.md$|BACKLOG\.md$|HARVEST\.md$|BLOCKED\.md$|IDEA_VAULT\.md$|build/)'; then
            echo 'Candidate attempted to modify locked/shared Forge authority or validation files.' >&2
            exit 1
          fi

          # Candidate branches may contain only their project and project handoff evidence.
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(projects/[^/]+/|handoffs/[^/]+\.md$)' || true)"
          if [[ -n "$bad" ]]; then
            echo 'Candidate changed paths outside projects/<slug>/ and handoffs/<slug>.md:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

          mapfile -t projects < <(
            printf '%s\n' "$changed" |
            awk -F/ '$1 == "projects" && NF >= 3 {print $2}' |
            sort -u
          )

          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "Official gate requires exactly one project per candidate branch; found ${#projects[@]}." >&2
            printf '%s\n' "${projects[@]:-}" >&2
            exit 1
          fi

          project="${projects[0]}"
          if [[ ! "$project" =~ ^mod-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Project directory must use mod-<slug> lowercase naming; got: $project" >&2
            exit 1
          fi

          if [[ ! -f "candidate/projects/$project/README.md" ]]; then
            echo "candidate/projects/$project/README.md is required." >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep '^handoffs/' | grep -Fvx "handoffs/$project.md"; then
            echo 'Candidate changed another project handoff.' >&2
            exit 1
          fi

          [[ -d "candidate/projects/$project/src" ]] || {
            echo 'A discoverable native module src/ directory is required.' >&2
            exit 1
          }

          if find "candidate/projects/$project" -type l -print -quit | grep -q .; then
            echo 'Symlinks are not permitted in harvest candidates.' >&2
            exit 1
          fi

          git -C candidate diff --check "$GITHUB_WORKFLOW_SHA"...HEAD

          # Hard live-environment tripwires.
          if grep -RIn --exclude-dir=.git --exclude='*.md' \
              -E '192\.168\.4\.77|tylerhanny/mod-adventure-nexus' \
              "candidate/projects/$project"; then
            echo 'Candidate contains a forbidden live-server/Adventure-Nexus reference.' >&2
            exit 1
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Validated candidate scope for $project at ${CANDIDATE_SHA}."

      - name: Checkout exact pinned AzerothCore
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 47960183bb03b83e8943eb2f0f39c16df9710c9d
          path: ac
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 2f7d9f774987d0157c6a0d0cc08c40bec3db3945
          path: ac/modules/mod-playerbots
          fetch-depth: 1
          persist-credentials: false

      - name: Stage candidate module into disposable pinned tree
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          [[ "$(git -C ac rev-parse HEAD)" == "$AC_COMMIT" ]]
          [[ "$(git -C ac/modules/mod-playerbots rev-parse HEAD)" == "$PLAYERBOTS_COMMIT" ]]
          mkdir -p "ac/modules/$PROJECT"
          rsync -a --delete --exclude='.git' "candidate/projects/$PROJECT/" "ac/modules/$PROJECT/"
          echo "Staged $PROJECT into disposable AzerothCore tree."

      - name: Install pinned-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get remove -y needrestart || true
          sudo apt-get install -y \
            ccache clang-18 cmake curl make unzip build-essential cmake-data \
            libboost-all-dev libbz2-dev libmysql++-dev libreadline-dev \
            libssl-dev libtool openssl zlib1g-dev google-perftools \
            libmysqlclient-dev libncurses-dev rsync mysql-server

      - name: Test protected upstream policy and real compiler file scope
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          sha256sum -c evidence/protected-validation.sha256
          python3 -B judge/validation/test_verify_build.py --integration 2>&1 | tee evidence/validation-selftests.log
          python3 -B judge/validation/verify_build.py identity --ac ac --evidence evidence --project "$PROJECT"

      - name: Restore compiler outputs for the same protected build policy
        uses: actions/cache@v4
        with:
          # Only compiler outputs/diagnostics are persisted. Transient preprocessed
          # source, the corrected WorldMock header and build/source trees are excluded.
          path: ${{ env.CCACHE_DIR }}
          key: forge-ccache-v1-ubuntu24-${{ runner.arch }}-${{ env.AC_COMMIT }}-${{ env.PLAYERBOTS_COMMIT }}-${{ hashFiles('judge/validation/**', 'judge/.github/workflows/official-candidate-gate.yml') }}-${{ github.run_id }}-${{ matrix.sha }}
          restore-keys: |
            forge-ccache-v1-ubuntu24-${{ runner.arch }}-${{ env.AC_COMMIT }}-${{ env.PLAYERBOTS_COMMIT }}-${{ hashFiles('judge/validation/**', 'judge/.github/workflows/official-candidate-gate.yml') }}-

      - name: Configure exact target with project warnings as errors
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR" "$CCACHE_TEMPDIR"
          # Hash compiler bytes and actual preprocessing output; retain original
          # source compilation on misses so warning/macro diagnostics are unchanged.
          # The config is outside the restored cache and overrides system defaults.
          cat > "$CCACHE_CONFIGPATH" <<'CONF'
          max_size = 1500M
          compiler_check = content
          direct_mode = false
          run_second_cpp = true
          sloppiness =
          base_dir =
          debug = false
          remote_storage =
          CONF
          ccache --show-config | tee evidence/ccache-config.log
          ccache --zero-stats

          cmake -S ac -B ac/build \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PROJECT_AzerothCore_INCLUDE="$GITHUB_WORKSPACE/judge/validation/upstream-warning-hook.cmake" \
            -DFORGE_UPSTREAM_INVENTORY="$GITHUB_WORKSPACE/evidence/upstream-source-inventory.json" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_COLOR_MAKEFILE=OFF \
            -DCMAKE_COLOR_DIAGNOSTICS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/ac/env/dist" \
            -DAPPS_BUILD=all \
            -DTOOLS_BUILD=none \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DWITH_WARNINGS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS='-Werror -ferror-limit=0' \
            -DCMAKE_CXX_FLAGS='-Werror -ferror-limit=0' \
            -DBUILD_TESTING=ON \
            -DNOPCH=true 2>&1 | tee evidence/configure.log

          loader="ac/build/modules/gen_scriptloader/static/ModulesLoader.cpp"
          grep -F "Add${PROJECT//-/_}Scripts();" "$loader"
          cp "$loader" evidence/ModulesLoader.cpp
          sha256sum -c evidence/protected-validation.sha256
          git -C judge diff --exit-code "$GITHUB_WORKFLOW_SHA" -- .
          python3 -B judge/validation/verify_build.py commands --ac ac --evidence evidence --project "$PROJECT"
          cp ac/build/compile_commands.json evidence/compile_commands.json

      - name: Compile complete pinned target
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          # OWNER-AUTHORIZED UPSTREAM POLICY: complete raw capture, verified physical
          # source provenance, command identities and exit status are checked fail-closed.
          # The exact authorized WorldMock delta is recorded, verified and restored
          # inside this build wrapper before the existing install/runtime stages.
          sha256sum -c evidence/protected-validation.sha256
          python3 -B judge/validation/verify_build.py build --ac ac --evidence evidence --project "$PROJECT"
          ccache --show-stats | tee evidence/ccache-stats.log

      - name: Verify dependency integrity after fixture restoration
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          sha256sum -c evidence/protected-validation.sha256
          git -C judge diff --exit-code "$GITHUB_WORKFLOW_SHA" -- .
          python3 -B judge/validation/verify_build.py check-log --ac ac --evidence evidence --project "$PROJECT"
          git -C ac diff --exit-code "$AC_COMMIT"
          git -C ac/modules/mod-playerbots diff --exit-code "$PLAYERBOTS_COMMIT"
          [[ "$(git -C ac rev-parse HEAD)" == "$AC_COMMIT" ]]
          [[ "$(git -C ac/modules/mod-playerbots rev-parse HEAD)" == "$PLAYERBOTS_COMMIT" ]]

      - name: Install into disposable server tree
        shell: bash
        run: |
          set -euo pipefail
          cmake --install ac/build --config Release 2>&1 | tee evidence/install.log

          while IFS= read -r -d '' dist; do
            cp -f "$dist" "${dist%.dist}"
          done < <(find ac/env/dist/etc -type f -name '*.conf.dist' -print0)

      - name: Validate module-owned SQL and repository data
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail

          # Reject destructive SQL. DROP TABLE IF EXISTS remains allowed for
          # module-owned repeat-safe migrations; other DROP TABLE forms do not.
          sql_list="$(mktemp)"
          find "candidate/projects/$PROJECT" -type f -iname '*.sql' -print0 > "$sql_list"
          mapfile -d '' -t sql_files < "$sql_list"
          if (( ${#sql_files[@]} > 0 )); then
            if grep -Pin '\b(TRUNCATE|DROP\s+DATABASE|DROP\s+TABLE\s+(?!IF\s+EXISTS))\b' -- "${sql_files[@]}"; then
              echo 'Potentially destructive SQL requires manual Reviewer disposition.' >&2
              exit 1
            else
              grep_status=$?
              [[ "$grep_status" -eq 1 ]] || { echo 'SQL scan failed.' >&2; exit "$grep_status"; }
            fi
          else
            echo 'No module-owned SQL files; SQL checks are not applicable.'
          fi

          # Every SQL file must be non-empty and end in a newline.
          for sql in "${sql_files[@]}"; do
            [[ -s "$sql" ]] || { echo "Empty SQL file: $sql" >&2; exit 1; }
            [[ "$(tail -c1 "$sql" | wc -l)" -eq 1 ]] || {
              echo "SQL file lacks final newline: $sql" >&2
              exit 1
            }
          done

      - name: Prepare disposable runtime data and MySQL
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master --single-branch \
            https://github.com/ac-data/ac-data.git ac/env/dist/data
          git -C ac/env/dist/data rev-parse HEAD > evidence/runtime-data-sha.txt
          sudo systemctl start mysql.service
          # GitHub-hosted disposable MySQL fixture; never a remote database.
          mysql --host=127.0.0.1 --user=root --password=root --execute='SELECT 1'
          mkdir -p ac/env/dist/logs

          # Keep Playerbots enabled without generating a random/addclass population
          # during the disposable startup check. AccountCount=0 is AUTO at this pin,
          # so both population pools must also be zero on this fresh database.
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path('ac/env/dist/etc/modules/playerbots.conf')
          text = config.read_text()
          values = {
              'AiPlayerbot.Enabled': 1,
              'AiPlayerbot.RandomBotAutologin': 0,
              'AiPlayerbot.MinRandomBots': 0,
              'AiPlayerbot.MaxRandomBots': 0,
              'AiPlayerbot.RandomBotAccountCount': 0,
              'AiPlayerbot.AddClassAccountPoolSize': 0,
          }
          for key, value in values.items():
              text, count = re.subn(r'^' + re.escape(key) + r'\s*=.*$',
                                   f'{key} = {value}', text, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'Expected one installed Playerbots setting: {key}')
          config.write_text(text)
          effective = ''.join(f'{key} = {value}\n' for key, value in values.items())
          Path('evidence/playerbots-runtime-fixture.conf').write_text(effective)
          print(effective, end='')
          PY

      - name: Dry-run authserver and worldserver
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
          AC_LOGIN_DATABASE_INFO: localhost;3306;root;root;acore_auth
          AC_CHARACTER_DATABASE_INFO: localhost;3306;root;root;acore_characters
          AC_WORLD_DATABASE_INFO: localhost;3306;root;root;acore_world
          AC_PLAYERBOTS_DATABASE_INFO: localhost;3306;root;root;acore_playerbots
          AC_DATA_DIR: ${{ github.workspace }}/ac/env/dist/data
          AC_LOGS_DIR: ${{ github.workspace }}/ac/env/dist/logs
        run: |
          set -euo pipefail
          timeout --kill-after=30s 5m ac/env/dist/bin/authserver --dry-run 2>&1 | tee evidence/authserver-dry-run.log
          grep -F 'Dry run completed, terminating.' evidence/authserver-dry-run.log
          timeout --kill-after=30s 5m ac/env/dist/bin/worldserver --dry-run 2>&1 | tee evidence/worldserver-dry-run.log
          grep -F 'WORLD: World Initialized In ' evidence/worldserver-dry-run.log
          grep -F 'AzerothCore Dry Run Completed, Terminating.' evidence/worldserver-dry-run.log
          if [[ "$PROJECT" == mod-forge-smoke ]]; then
            grep -F 'FORGE_SMOKE_CONFIG reload=0 enabled=1 control=314159' evidence/worldserver-dry-run.log
          fi

          error_log="ac/env/dist/logs/Errors.log"
          if [[ -s "$error_log" ]]; then
            echo 'Errors.log contains startup errors:' >&2
            cat "$error_log" >&2
            exit 1
          fi

      - name: Run required pinned unit tests
        shell: bash
        run: |
          set -euo pipefail
          [[ -x ac/build/src/test/unit_tests ]] || {
            echo 'BUILD_TESTING=ON must produce the pinned unit test executable.' >&2
            exit 1
          }
          ac/build/src/test/unit_tests 2>&1 | tee evidence/unit-tests.log

      - name: Recheck dependency integrity after install and runtime
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          set -euo pipefail
          sha256sum -c evidence/protected-validation.sha256
          git -C judge diff --exit-code "$GITHUB_WORKFLOW_SHA" -- .
          python3 -B judge/validation/verify_build.py check-log --ac ac --evidence evidence --project "$PROJECT"
          git -C ac diff --exit-code "$AC_COMMIT"
          git -C ac/modules/mod-playerbots diff --exit-code "$PLAYERBOTS_COMMIT"
          [[ "$(git -C ac rev-parse HEAD)" == "$AC_COMMIT" ]]
          [[ "$(git -C ac/modules/mod-playerbots rev-parse HEAD)" == "$PLAYERBOTS_COMMIT" ]]

      - name: Preserve gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-gate-${{ matrix.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            ac/env/dist/logs/
          if-no-files-found: error

      - name: Publish validation evidence
        if: always()
        shell: bash
        env:
          PROJECT: ${{ steps.scope.outputs.project }}
        run: |
          {
            echo '## Official Candidate Gate'
            echo
            echo "- Candidate branch: \`$CANDIDATE_BRANCH\`"
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Project: \`${PROJECT:-unknown}\`"
            echo "- AzerothCore pin: \`$AC_COMMIT\`"
            echo "- Playerbots pin: \`$PLAYERBOTS_COMMIT\`"
            echo "- Judge commit: \`$GITHUB_WORKFLOW_SHA\`"
            echo "- Judge workflow SHA-256: \`$(cut -d' ' -f1 evidence/judge-workflow.sha256)\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'A green job means scope integrity, exact-pin configure/build/install, dependency integrity with the disclosed test-fixture exception, SQL static checks, and disposable dry-run startup all completed successfully.'
            echo 'It does **not** mean Tyler has performed live/in-game gameplay validation.'
            echo 'Pinned dry-run initializes scripts, module configuration, databases, and world data, but exits before WorldScript::OnStartup, network service, and the world update loop. Candidates depending on those paths require additional Reviewer runtime evidence.'
            echo
            echo 'STANDING OWNER-AUTHORIZED UPSTREAM POLICY: warnings exclusively from verified-unchanged pinned AzerothCore/Playerbots source are non-fatal and fully visible below. Project-owned or unknown warnings, actual errors and incomplete captures fail. Both pins and all other gates remain unchanged.'
            echo 'OWNER-AUTHORIZED TEST FIXTURE: the exact two-method WorldMock correction is used only during disposable CI compilation, separately attested below, and restored before install. It is never classified as unchanged upstream. No test or assertion is removed.'
            echo 'Protected validation file hashes are preserved in evidence/protected-validation.sha256.'
            if [[ -f evidence/upstream-warning-verdict.json ]]; then
              echo
              sed 's/^/    /' evidence/upstream-warning-verdict.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
